body:
  text: 王子正論帝嘗問曰漢桓帝時白馬令李雲上書言帝者諦也是帝欲不諦當何得不死肅對曰但為言失逆順之節原其本意皆欲盡心念存補國且帝者之威過於雷霆殺一匹夫無異螻蟻寬而宥之可以示容受切言廣德宇於天下故臣以為殺之未必為是也三國魏志本傳帝又問曰司馬遷以受刑之故內懷隱切著史記非貶孝武令人切齒對曰司馬遷記事不虛美不隱惡劉向揚雄稱其善敘事有良史之才謂之實録漢武帝聞其述史記取孝景及己本紀覽之於是大怒削而投之於今此兩紀有録無書後遭李陵事遂下遷蠶室此為隱切在孝武而不在史遷也同上嘉平四年五月有二魚長尺集于武庫之屋有司以為吉祥肅曰魚生於淵而亢於屋介鱗之物失其所也邊將其殆有棄甲之變乎其後果有東關之敗同上又晉書五行志嘉平六年白氣經天大將軍司馬景王問肅其故肅答曰此蚩尤之旗也東南其有亂乎君若修己以安百姓則天下樂安者歸德唱亂者先亡矣明年春鎮東將軍母丘儉揚州刺史文欽反景王謂肅曰霍光感夏侯勝之言始重儒學之士良有以也安國寧主其術焉在肅曰昔關羽率荊州之衆降于禁於漢濱遂有北向爭天下之志後孫權襲取其將士家屬羽士衆一旦瓦解今淮南將士父母妻子皆在內州但急往禦衛使不得前必有關羽土崩之藝矣景王從之遂破儉欽三國魏志本傳王社謂春祈藉田秋而報之也太社王者布下圻內為百姓立之謂之太社不自立於京都也晉書禮志引王景侯之論太尉等祭祀但稱名而稱臣每有事須告皆遣祝史杜佑通典卷四十五太和六年尚書難王肅以曾子問唯祫於太祖群祖皆從而不言禘知禘不合食肅答曰以為禘祫殷祭群主皆合舉祫則禘可知也通典卷四十九武宣皇后太和四年六月崩至六年三月有司以今年四月禘告王肅曰今宜以崩年數按春秋閔公二年夏禘于莊公是時縗絰之中至二十五月大祥便禘不復禪故譏其速也去四年六月武宣皇后崩二十六日晚葬除服即吉四時之祭皆親行事今當計始除服日數當如禮須到禫月乃禘同上今除即吉故特時祭至於禘祫宜存古禮通典卷五十尚書薛悌奏刺史所上靈命瑞圖當下洛陽留臺使太尉醮告太祖文昭皇后廟王肅議曰禮有事於王父則以王母配不降於四時常祀而不配也且夫五精之帝非重於地今奉嘉瑞以告而地獨闕於義未通以地配天於義正宜通典卷五十五魏祀五郊六宗及厲殃王肅議曰厲殃漢之淫祀耳日月有常位五帝有常典師曠自是樂祖無事於厲殃同人非禮器雄黃等非禮飾漢文除祕祝所以稱仁明也通典卷五十五司徒廣陵陳矯字季弼本劉氏養於陳氏及其薨劉氏弟子疑所服以問王肅答曰昔陳司徒喪母諸儒陳其子無服甚失禮矣為外祖父母小功此以異姓而有服者豈不以母之所生反重於父之所生不亦左乎為人後者其婦為舅姑大功婦他人也猶為夫故父母降一等祖至親也而可以無服乎推婦降一等則子孫宜依本親而降一等通典卷六十九魏尚書奏以故漢獻帝嫡孫杜氏鄉侯劉康襲爵假授使拜授康素服王肅議曰尊者臨卑不制縗麻故為之素服今康處三年喪在縗絰之中若因喪以命之則無復素服若以尊崇王命則吉服以拜受按尚書康王受策命吉服而受之事畢又以吉服出應門內以命諸侯皆出然後王釋冕服故臣以諸侯受天子之命宜以吉服又禮處三年之喪而當除父兄之喪服除卒事然後反喪服則受天子命者亦宜服其命服使者出反喪服即位而哭即合於禮又合人情詔從之通典卷七十二景初中明帝崩于建始殿殯于九龍殿尚書訪曰當以明皇帝諡告四祖祝文於高皇帝稱元孫之子云何王肅曰禮稱曾孫某謂國家也荀爽鄭元説皆云天子諸侯事曾祖已上皆稱曾孫通典卷七十九又訪按漢既葬容衣還儒者以為宜如文皇帝故事以存時所服王肅曰禮雖無容衣之制今須容衣還而後虞祭宜依尸服卒者上服之制生時褻服可隨所存至於制度則不如禮孔子曰祭之以禮亦謂此也諸侯之上服則今服也天子不為命服然亦所以命服之上也按漢氏西京故事月遊衣冠則容衣也言冠以正服不以褻衣也同上尚書又訪容衣還群臣故當在帳中當填衛見王肅曰禮不墓祭而漢氏正月止陵神座在西序東向百辟計吏前告郡之穀價人之疾苦欲先帝魂靈聞知時蔡雍以為禮有煩而不可去事亡如存況今無填衛之禁而合於如事存之義可見於門內拜訖入帳臨乃除服同上尚書盧育以禮言遂除者謂有服者耳無服者則不哭王肅曰既言除喪豈有服哉雖除始見墳斂髮袒絰言除斂髮袒絰耳記云朋友之喪有宿草而不哭焉朋友未踰年雖無服猶哭之豈有天子之喪未踰時始奔赴而得不哭者乎今雖權宜即吉吾本三年之喪也故三年之後行祫禘之禮又遠方弔貢表皆宜通若有禁乃止此不得與哭陵相妨害也通典卷八十前説遂除謂除斂髮袓絰耳不謂今之奔者皆須斂髮也責以元衣冠又其所不能具自可服深衣白夾也同上遣使弔司空陳群王肅議曰禮臣有父母之喪訃君弔之諸臣之母當從夫爵通典卷八十三尚書左丞王煚除陳相未到國而王薨議者或以為宜𪗋縗或以為宜無服王肅云王國相本王之丞按漢景帝時貶為相成帝時使理人王則國家所以封王相則國家使為王臣但王不與理人之事耳而云相專為理人不純臣於王非其義也今煚至許昌而聞王薨姓名未通恩紀未交君臣未禮不責人之所不能於義未正服君臣之服傳曰策名委質二乃辟也若夫未策名未委質不可以純君臣之義也禮婦人入門未三月廟見死猶歸葬於其黨不得以六禮既備又以入室遂成其婦禮也則臣之未委質者亦不得備臣禮也曾子問曰娶女有吉日而女死如之何孔子曰壻𪗋縗而弔既葬而除之夫死亦如之各以其服如服斬縗斬縗而弔之既葬而除之也今煚為王相未入國而王薨義與女未入門夫死同則煚宜服斬縗既葬而除之此禮之明文也禮曰與諸侯為親者服斬雖有親為臣則服斬縗也臣為其君服之或曰宜𪗋縗不亦遠於禮乎通典卷八十八尚書郎武竺有同母異父昆弟之喪以訪王肅肅據子思書曰言氏之子達於禮乎繼父同居服周則子宜大功也通典卷九十一高皇諱明皇帝既祔儒者遷高皇主尚書來訪宜復講不及引殷家或乃同名答曰殷家以甲乙為字既一名不偏諱且殷質故也禮所謂捨故而諱新諸侯則五代不諱天子之制恐不得與諸侯同五代則不諱也春秋魯諱具敖二山五代之後可不復為諱然已易其名則故名不復諱也猶漢之元后父名禁改禁中為省中至今遂以省中為稱非能為元后諱徒以名遂行故也春秋時晉范獻子適魯名其二山自以為不學當獻子時魯不復為二名諱而獻子自以為犯諱直所謂不學者也禮曰詩書臨文廟中皆不諱此乃謂不諱見在之廟不謂已毀者也文王名昌武王名發成王時頌曰克昌厥後俊發爾私箕子為武王陳洪範曰欲羞其行而國其昌厲王名胡其子宣王時詩曰胡不相畏先祖于摧其孫幽王時詩曰哀今之人胡為虺蜴此則詩書不諱明驗也按漢氏不名諱常曰臣妾不得以為名字其言事不諱蓋取諸此也然則周禮其不諱時則非唯詩書臨文廟中其餘皆不諱矣今可太祖以上去墠乃不諱諱三祖以下盡親如禮唯詩書臨文廟中不諱自此以後雖百代如漢氏故事臣妾唯不得以為名字其言事不諱所謂魏國於漢禮有損益質文隨時亦合尊之大義也通典卷一百四王者各以其禮制事天地今説者據周官屬文為經國大體懼其局而不宏也漢武帝東巡狩封禪還祠太一于甘泉祭后土于汾陰皆盡用其樂言盡用者謂盡用宮懸之樂也天地之性貴質者蓋謂其器之不文不謂庶物當減也禮天子宮懸舞八佾今祀圓丘方澤宜以天子制設宮懸之樂八佾之舞通典卷一百四十七説者以為周家祀天唯舞雲門祭地唯舞咸池宗廟唯舞八佾似失其義矣周禮賓客皆作備樂左傳王子頽享五大夫樂及遍舞六代之樂也然則一會之日具作六代之樂天地宗廟事之大者賓客宴會此之為細王制曰庶羞不踰牲燕衣不踰祭服可以燕樂而踰天地宗廟之樂乎周官以六律六同五聲八音六舞大合樂以致鬼神以和邦國以諧萬民以安賓客以悅遠人夫六律六呂五聲八音皆一時而作之至於六舞獨分擘而用之所以厭人心也又周官𩎟師掌教𩎟樂祭祀亦帥其屬而舞之大享亦如之𩎟東夷之樂也又鞮鞻掌四夷之樂與其聲歌則吹而歌之燕亦如之四夷之樂乃入宗廟先代之典獨不得用大享及燕曰如之者明古今夷夏之樂皆主之於宗廟而後播及其餘也夫作先王樂者貴能苞而用之也納四夷之樂者美德廣之所及也高皇帝太祖高祖文昭廟皆宜兼用先代及武始太均之舞同上季冬大儺旁磔雞出土牛以送寒氣即今之臘除疫磔雞葦絞桃梗之屬太平御覽卷三十二
